<!doctype html>

<script>
const KICK='Услуга 6 из 7', H1='AI-таргет <em>(платная реклама)</em>';
const TXT='<div class="txt fx-up"><span class="kick">'+KICK+'</span><h1 class="h1">'+H1+'</h1></div>';
const ITEMS=[['01','Facebook и Instagram','настраивает и запускает кампании'],['02','Объявления','создаёт и тестирует десятками'],['03','24/7','ведёт и переключает без выходных']];
const OUT='<div class="out fx-up">'+ITEMS.map(i=>'<div><i>'+i[0]+'</i><b>'+i[1]+'</b><span>'+i[2]+'</span></div>').join('')+'</div>';
const BIG='<div class="big"><span class="cnt" data-to="400000">$0</span>+<small>рекламного бюджета уже прошло через этого агента</small></div>';
const CLAIM='Заменяет работу полноценного таргетолога', PRICE='$300–$800 · в месяц · сложность средняя';
const GIT='<div class="git fx-up"><div class="win"><div class="bar"><i></i><i></i><i></i><span>github.com · ai-ads-agent</span></div><img src="assets/vlad-1409/uslugi/target-github.jpg" alt=""></div><p class="cap">движок агента-рекламщика, открытый код</p></div>';
const Y='#fdd506',CR='#f5f3ee',MU='#c4bdb1',DM='#6f685e',RL='#2a2420',PN='#15110d',RD='#c6000c',GN='#39d353';
/* глифы: f и камера */
const FB=(x,y,s=1)=>`<g transform="translate(${x} ${y}) scale(${s})"><circle r="17" fill="${PN}" stroke="#3a3129"/><path d="M3 10 V0 H8 V-5 H3 V-8 c0-2 1-3 3-3 h2 V-15 H5 c-5 0-7 3-7 7 v3 H-5 V0 H-2 V10 Z" fill="${CR}"/></g>`;
const IG=(x,y,s=1)=>`<g transform="translate(${x} ${y}) scale(${s})"><rect x="-17" y="-17" width="34" height="34" rx="10" fill="${PN}" stroke="#3a3129"/><rect x="-9.5" y="-9.5" width="19" height="19" rx="6" fill="none" stroke="${CR}" stroke-width="1.8"/><circle r="4.3" fill="none" stroke="${CR}" stroke-width="1.8"/><circle cx="5.8" cy="-5.8" r="1.3" fill="${CR}"/></g>`;
const CHIP=(x,y)=>`<g transform="translate(${x} ${y})"><rect x="-30" y="-22" width="60" height="44" rx="8" fill="${PN}" stroke="${Y}"/><circle r="7" fill="${Y}"><animate attributeName="r" values="6;9;6" dur="1.6s" repeatCount="indefinite"/></circle><circle r="7" fill="none" stroke="${Y}" opacity=".5"><animate attributeName="r" values="7;18" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".6;0" dur="1.6s" repeatCount="indefinite"/></circle><text y="34" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="9" letter-spacing="2" fill="${DM}">АГЕНТ</text></g>`;
const flow=(d,delay=0)=>`<path d="${d}" fill="none" stroke="${RL}" stroke-width="1.5"/><path d="${d}" fill="none" stroke="${Y}" stroke-width="1.5" stroke-dasharray="6 10" opacity=".8"><animate attributeName="stroke-dashoffset" from="64" to="0" dur="1.4s" begin="${delay}s" repeatCount="indefinite"/></path>`;
const once=(attr,vals,dur,begin)=>`<animate attributeName="${attr}" values="${vals}" dur="${dur}s" begin="${begin}s" fill="freeze" calcMode="spline" keySplines="${vals.split(';').slice(1).map(()=>'.2 .8 .2 1').join(';')}"/>`;
function countUp(s){s.querySelectorAll('.cnt').forEach(n=>{const to=+n.dataset.to,t0=performance.now()+700,dur=1800;const tick=()=>{const k=Math.min(1,(performance.now()-t0)/dur);if(k<0){requestAnimationFrame(tick);return;}const e=1-Math.pow(1-k,3);n.textContent='$'+String(Math.round(to*e)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');if(k<1)requestAnimationFrame(tick);};requestAnimationFrame(tick);});}

/* ─── А · пульт кампаний: 12 объявлений тестируются, слабые выключаются, бюджет перетекает в сильные ─── */
function svgA(){
  const W=600,H=400;let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  s+=`<rect x="0" y="0" width="${W}" height="${H}" rx="14" fill="#0f0c09" stroke="${RL}"/>`;
  s+=`<rect x="0" y="0" width="${W}" height="34" rx="14" fill="${PN}"/><rect x="0" y="20" width="${W}" height="14" fill="${PN}"/><line x1="0" y1="34" x2="${W}" y2="34" stroke="${RL}"/>`;
  s+=`<circle cx="22" cy="17" r="4" fill="${GN}"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" repeatCount="indefinite"/></circle><text x="34" y="21" font-family="JetBrains Mono,monospace" font-size="10" letter-spacing="2" fill="${MU}">ADS MANAGER</text>`;
  s+=`<text x="${W-16}" y="21" text-anchor="end" font-family="JetBrains Mono,monospace" font-size="10" letter-spacing="2" fill="${Y}">24/7</text>`;
  s+=FB(60,150,1.15)+IG(60,270,1.15)+CHIP(160,210);
  s+=flow('M80 150 C115 150 115 210 130 210',0)+flow('M80 270 C115 270 115 210 130 210',.5);
  // grid 3x3, крупные карточки
  const cols=3,rows=3,cw=104,ch=88,gx=232,gy=58,gap=14;
  const losers=[1,3,5,6,7],winners=[0,4,8];
  const vals=[88,18,42,22,92,15,20,12,74];
  let k=0;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++,k++){
    const x=gx+c*(cw+gap),y=gy+r*(ch+gap),t=.5+k*.16,isL=losers.includes(k),isW=winners.includes(k);
    s+=`<g opacity="0">${once('opacity','0;1',.4,t)}`;
    s+=`<rect x="${x}" y="${y}" width="${cw}" height="${ch}" rx="8" fill="${PN}" stroke="#3a3129"/>`;
    s+=`<rect x="${x+10}" y="${y+10}" width="38" height="30" rx="4" fill="#221b16"/><rect x="${x+56}" y="${y+13}" width="38" height="5" rx="2.5" fill="#3a3129"/><rect x="${x+56}" y="${y+25}" width="26" height="5" rx="2.5" fill="#3a3129"/>`;
    s+=`<rect x="${x+10}" y="${y+58}" width="${cw-20}" height="9" rx="4.5" fill="#221b16"/><rect x="${x+10}" y="${y+58}" width="0" height="9" rx="4.5" fill="${isW?Y:MU}">${once('width','0;'+((cw-20)*vals[k]/100).toFixed(1),.9,t+1.2)}</rect>`;
    if(isL){s+=`<g opacity="0">${once('opacity','0;1',.3,3.6+k*.1)}<rect x="${x}" y="${y}" width="${cw}" height="${ch}" rx="8" fill="#0b0907" opacity=".74"/><g transform="translate(${x+cw/2} ${y+ch/2})"><circle r="13" fill="${RD}"/><path d="M-5 -5 L5 5 M5 -5 L-5 5" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></g></g>`;}
    if(isW){s+=`<rect x="${x-2}" y="${y-2}" width="${cw+4}" height="${ch+4}" rx="10" fill="none" stroke="${Y}" stroke-width="2.5" opacity="0">${once('opacity','0;1',.4,4.6)}</rect><g opacity="0">${once('opacity','0;1',.3,5)}<rect x="${x+cw-64}" y="${y-10}" width="70" height="20" rx="10" fill="${Y}"/><text x="${x+cw-29}" y="${y+4}" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="9.5" font-weight="700" letter-spacing="1" fill="#0b0907">+БЮДЖЕТ</text></g>`;}
    s+=`</g>`;
  }
  winners.forEach((k,i)=>{const c=k%cols,r=Math.floor(k/cols),x=gx+c*(cw+gap),y=gy+r*(ch+gap)+ch/2;const d=`M190 210 C215 210 205 ${y} ${x} ${y}`;
    s+=`<g opacity="0">${once('opacity','0;1',.5,4.8+i*.2)}${flow(d,i*.3)}</g>`;});
  s+=`<text x="${gx}" y="${H-16}" font-family="Manrope,sans-serif" font-size="11" fill="${MU}">9 объявлений в тесте · <tspan fill="${RD}">5 выключил</tspan> · <tspan fill="${Y}" font-weight="700">3 масштабирует</tspan></text>`;
  return s+'</svg>';
}

/* ─── Б · конвейер: три креатива, сканер, тумблеры, поток $ от FB/IG через агента ─── */
function svgBover(){
  // overlay over 3 cards (viewBox 0 0 600 200): scan line + badge + toggle per card
  const W=600,H=200,cw=180,g=30;let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">`;
  const cpl=['$3.9','$11.4','$4.6'],off=[false,true,false];
  for(let i=0;i<3;i++){const x=i*(cw+g),t=.6+i*.9;
    s+=`<rect x="${x}" y="0" width="${cw}" height="3" fill="${Y}" opacity="0"><animate attributeName="y" values="0;${H-3}" dur=".9s" begin="${t}s" fill="freeze"/><animate attributeName="opacity" values="0;.9;.9;0" keyTimes="0;.1;.9;1" dur=".9s" begin="${t}s" fill="freeze"/></rect>`;
    s+=`<g opacity="0">${once('opacity','0;1',.3,t+1)}<rect x="${x+10}" y="${H-38}" width="86" height="24" rx="12" fill="#0b0907" stroke="${off[i]?RD:Y}"/><text x="${x+53}" y="${H-22}" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="10" font-weight="700" fill="${off[i]?RD:Y}">CPL ${cpl[i]}</text></g>`;
    // toggle
    s+=`<g opacity="0">${once('opacity','0;1',.3,t+1)}<rect x="${x+cw-52}" y="${H-36}" width="42" height="20" rx="10" fill="${off[i]?'#221b16':Y}">${off[i]?`<animate attributeName="fill" values="${Y};${Y};#221b16" keyTimes="0;.6;1" dur="1s" begin="${t+1.6}s" fill="freeze"/>`:''}</rect><circle cx="${x+cw-20}" cy="${H-26}" r="8" fill="#0b0907">${off[i]?`<animate attributeName="cx" values="${x+cw-20};${x+cw-20};${x+cw-42}" keyTimes="0;.6;1" dur="1s" begin="${t+1.6}s" fill="freeze"/><animate attributeName="fill" values="#0b0907;#0b0907;${RD}" keyTimes="0;.6;1" dur="1s" begin="${t+1.6}s" fill="freeze"/>`:''}</circle></g>`;
  }
  return s+'</svg>';
}
function svgBpipe(){
  const W=600,H=140;let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  s+=FB(30,50,.9)+IG(30,100,.9)+CHIP(150,75);
  s+=flow('M46 50 C90 50 90 75 120 75',0)+flow('M46 100 C90 100 90 75 120 75',.6);
  const ends=[[300,30],[300,75],[300,120]];
  ends.forEach((e,i)=>{const d=`M180 75 C230 75 230 ${e[1]} ${e[0]} ${e[1]}`;s+=flow(d,i*.4);
    s+=`<g><animateMotion path="${d}" dur="2.2s" begin="${i*.7}s" repeatCount="indefinite"/><circle r="7" fill="${Y}"/><text y="3.5" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="9" font-weight="700" fill="#0b0907">$</text></g>`;});
  s+=`<text x="330" y="34" font-family="Manrope,sans-serif" font-size="11" fill="${CR}">объявление A · <tspan fill="${Y}" font-weight="700">масштабируем</tspan></text>`;
  s+=`<text x="330" y="79" font-family="Manrope,sans-serif" font-size="11" fill="${MU}">объявление B · <tspan fill="${RD}" font-weight="700">выключено в 02:14</tspan></text>`;
  s+=`<text x="330" y="124" font-family="Manrope,sans-serif" font-size="11" fill="${CR}">объявление C · <tspan fill="${Y}" font-weight="700">бюджет +40%</tspan></text>`;
  s+=`<rect x="330" y="40" width="0" height="4" rx="2" fill="${Y}">${once('width','0;230',1.6,3.6)}</rect><rect x="330" y="85" width="0" height="4" rx="2" fill="${RD}">${once('width','0;60',1,3.8)}</rect><rect x="330" y="130" width="0" height="4" rx="2" fill="${Y}">${once('width','0;170',1.6,4)}</rect>`;
  return s+'</svg>';
}

/* ─── В · сутки агента: 24-часовое кольцо, стрелка, события ─── */
function svgC(){
  const W=560,H=520,cx=250,cy=255,R=150,D=16;let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  s+=`<defs><radialGradient id="cg" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="${Y}" stop-opacity=".14"/><stop offset="1" stop-color="${Y}" stop-opacity="0"/></radialGradient></defs>`;
  s+=`<circle cx="${cx}" cy="${cy}" r="${R+30}" fill="url(#cg)"/><circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${RL}" stroke-width="10"/>`;
  s+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${Y}" stroke-width="10" stroke-dasharray="${(2*Math.PI*R).toFixed(1)}" stroke-dashoffset="${(2*Math.PI*R).toFixed(1)}" stroke-linecap="round" transform="rotate(-90 ${cx} ${cy})"><animate attributeName="stroke-dashoffset" from="${(2*Math.PI*R).toFixed(1)}" to="0" dur="${D}s" repeatCount="indefinite"/></circle>`;
  for(let i=0;i<24;i++){const a=i*15*Math.PI/180,big=i%6===0;s+=`<line x1="${(cx+(R-14)*Math.sin(a)).toFixed(1)}" y1="${(cy-(R-14)*Math.cos(a)).toFixed(1)}" x2="${(cx+(R-(big?24:19))*Math.sin(a)).toFixed(1)}" y2="${(cy-(R-(big?24:19))*Math.cos(a)).toFixed(1)}" stroke="${big?MU:RL}" stroke-width="${big?2:1}"/>`;
    if(big)s+=`<text x="${(cx+(R-40)*Math.sin(a)).toFixed(1)}" y="${(cy-(R-40)*Math.cos(a)+4).toFixed(1)}" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="10" fill="${DM}">${String(i).padStart(2,'0')}:00</text>`;}
  // hand
  s+=`<g><animateTransform attributeName="transform" type="rotate" from="0 ${cx} ${cy}" to="360 ${cx} ${cy}" dur="${D}s" repeatCount="indefinite"/><line x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy-R+6}" stroke="${Y}" stroke-width="2" stroke-linecap="round" opacity=".9"/><circle cx="${cx}" cy="${cy-R}" r="7" fill="${Y}"/></g>`;
  // center: FB+IG → agent core
  s+=FB(cx-70,cy-10,.85)+IG(cx+70,cy-10,.85);
  s+=flow(`M${cx-53} ${cy-10} L${cx-30} ${cy-10}`,0)+flow(`M${cx+53} ${cy-10} L${cx+30} ${cy-10}`,.4);
  s+=`<circle cx="${cx}" cy="${cy-10}" r="26" fill="${PN}" stroke="${Y}"/><circle cx="${cx}" cy="${cy-10}" r="9" fill="${Y}"><animate attributeName="r" values="8;12;8" dur="1.6s" repeatCount="indefinite"/></circle><circle cx="${cx}" cy="${cy-10}" r="26" fill="none" stroke="${Y}"><animate attributeName="r" values="26;44" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".6;0" dur="1.6s" repeatCount="indefinite"/></circle>`;
  s+=`<text x="${cx}" y="${cy+42}" text-anchor="middle" font-family="Unbounded,sans-serif" font-size="30" font-weight="500" letter-spacing="-1" fill="${CR}">24/7</text><text x="${cx}" y="${cy+60}" text-anchor="middle" font-family="Manrope,sans-serif" font-size="11" fill="${MU}">ведёт и переключает без выходных</text>`;
  // events: [hour, label, sub, color]
  const EV=[[2,'02:10 · выключил слабое','объявление #7 сливало бюджет',RD],[7,'07:00 · перекинул бюджет','на объявление с лучшей ценой заявки',Y],[12,'12:00 · запустил 12 новых','варианты текста и картинки',CR],[19,'19:30 · отчёт цифрами','заявки ×3.1 · CPL −23%',Y]];
