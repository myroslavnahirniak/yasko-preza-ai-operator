const X=[13.9,32.8,50.3,67.5,84.7];
function mark(slide,step,sel){slide.querySelectorAll(sel).forEach((el,i)=>el.classList.toggle('on',i===step));}
window.VARIANTS={
A:{steps:4,html:HD+'<div class="sk-row">'+ITEMS.map((t,i)=>'<div class="sk"><img src="'+SK[i]+'" alt=""><b>'+t+'</b></div>').join('')+'</div><div class="bigname"><b></b><i></i></div><div class="dots">'+ITEMS.map(()=>'<i></i>').join('')+'</div>',
  onStep:(s,st)=>{mark(s,st,'.sk');mark(s,st,'.dots i');s.querySelector('.bigname b').textContent=ITEMS[st];s.querySelector('.bigname i').textContent='0'+(st+1)+' / 05';},

B:{steps:4,cls:'v-B24',html:HD+'<div class="mon">'+SHOT.map(s=>'<img src="'+s+'" alt="">').join('')+'<span class="onair"><i></i>в эфире</span><div class="lab"></div></div><div class="strip">'+ITEMS.map((t,i)=>'<div class="th"><div class="scr"><img src="'+SHOT[i]+'" alt=""><span class="cam">CAM '+(i+1)+'</span></div><b>'+t+'</b></div>').join('')+'</div>',

window.ORDER=['A','B','C'];
