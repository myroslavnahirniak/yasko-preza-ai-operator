const slide=document.getElementById('slide');let cur='A',initStep=0,hold=false;
function render(){clr();step=initStep;initStep=0;slide.className='slide v'+cur;slide.innerHTML=V[cur].html();document.querySelectorAll('[data-v]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.v===cur)));document.querySelector('.description').textContent=V[cur].desc;if(V[cur].show)T(()=>V[cur].show(step),50);
 // auto-advance in the demo
 if(V[cur].steps>1&&step===0&&!hold){const n=V[cur].steps;let i=1;const tick=()=>{if(i>=n)return;step=i;V[cur].show(i);i++;T(tick,cur==='A'?2600:2000)};T(tick,2600)}}
function next(){if(!V[cur].show)return;clr();step=(step+1)%V[cur].steps;V[cur].show(step)}
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{cur=b.dataset.v;render()});
document.getElementById('replay').onclick=render;document.getElementById('next').onclick=next;
document.addEventListener('keydown',e=>{const o=['S','A','B','C'];let i=o.indexOf(cur);if(e.key==='ArrowRight')i=(i+1)%4;else if(e.key==='ArrowLeft')i=(i+3)%4;else if(e.key===' '){e.preventDefault();next();return}else return;cur=o[i];render();});
const q=new URLSearchParams(location.search);if(V[q.get('v')])cur=q.get('v');if(q.has('step')){initStep=+q.get('step');hold=true}render();
</script></body></html>
