<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Слайд 62 · два варианта</title>
<style>
:root{--bg:#0b0907;--fg:#f5f3ee;--mut:#b3a996;--key:#fdd506;--line:#2a2420}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.5 -apple-system,'Helvetica Neue',Arial,sans-serif}
header{padding:20px 24px 4px}header h1{margin:0;font-size:20px;font-weight:600}header p{margin:6px 0 0;color:var(--mut)}
main{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:24px;padding:20px 24px 32px}
figure{margin:0}figcaption{margin:12px 2px 0}figcaption b{color:var(--key)}figcaption span{display:block;color:var(--mut);margin-top:4px}
.frame{position:relative;width:100%;aspect-ratio:1;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#000}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
</style></head><body>
<header><h1>Слайд 62 «Саша говорил слово в слово» — два варианта</h1><p>Живой рендер деки. Скажи «A» или «B» — применю выбранный в деку.</p></header>
<main>
<figure><div class="frame"><iframe data-v="v62a" src="rest.html?square&clean&s=62&opt=a"></iframe></div><figcaption><b>A · Полароид.</b><span>Цитата крупно сверху по центру, под ней фото в светлой рамке полароида с лёгким наклоном. Вертикальная композиция.</span></figcaption></figure>
<figure><div class="frame"><iframe data-v="v62b" src="rest.html?square&clean&s=62&opt=b"></iframe></div><figcaption><b>B · Две колонки.</b><span>Слева большая жёлтая кавычка и цитата, справа фото со скруглением и смещённой жёлтой рамкой. Горизонтальная композиция.</span></figcaption></figure>
</main>
<script>
document.querySelectorAll('iframe[data-v]').forEach(function(f){f.addEventListener('load',function(){var n=0;(function t(){try{var q=f.contentDocument.querySelector('.slide.on .s2n-qp');if(q){q.classList.add(f.dataset.v);return}}catch(e){}if(++n<50)setTimeout(t,100)})()})});
</script>
</body></html>
