<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Третій слайд — Предмет у фокусі · AI-Оператор</title>
  <link rel="stylesheet" href="assets/fonts.css">
  <link rel="stylesheet" href="css/s3-lab.css?v=1788999514">
  <link rel="stylesheet" href="css/s3-spotlight.css?v=1788999514">
  <link rel="stylesheet" href="css/opening-type.css?v=1788999514">
</head>
<body>
  <main class="lab">
    <aside class="lab-sidebar">
      <a class="lab-brand" href="/?square&clean&s=3">AI-Оператор <span>03 / дизайн</span></a>
      <h1>Предмет<br>у фокусі</h1>
      <p class="lab-intro">Три тези й одне прохання.</p>
      <div class="lab-description" id="description"></div>
      <div class="lab-controls">
        <div class="lab-step-caption"><span id="stepLabel" aria-live="polite">Елемент 1 із 3</span><span class="lab-format">1:1</span></div>
        <div class="lab-step-buttons">
          <button type="button" id="back" aria-label="Попередній крок"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button>
          <button type="button" id="next" class="lab-primary">Наступний елемент <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button>
        </div>
        <div class="lab-secondary-controls">
          <button type="button" id="play" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7Z"/></svg><span>Автопоказ</span></button>
          <button type="button" id="all">Показати фінал</button>
        </div>
        <button type="button" class="lab-restart" id="restart">Спочатку</button>
      </div>
      <p class="lab-help">Клік по слайду або → — наступний крок.<br>← — назад. Наприкінці — завершальне прохання.</p>
    </aside>
    <section class="lab-preview" aria-label="Перегляд слайда">
      <div class="lab-preview-top"><span id="variantTitle">Предмет у фокусі</span><button type="button" id="fullscreen" aria-label="Показати слайд на весь екран"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3H3v6m12-6h6v6M3 15v6h6m12-6v6h-6"/></svg></button></div>
      <div class="s3-canvas" id="canvas" tabindex="0" role="button" aria-label="Слайд 3. Натисніть, щоб показати наступний елемент"></div>
    </section>
  </main>
  <script src="js/slides.js?v=1788999514"></script>
  <script src="js/s3-spotlight.js?v=1788999514"></script>
  <script src="js/s3-lab.js?v=1788999514"></script>
</body>
</html>
