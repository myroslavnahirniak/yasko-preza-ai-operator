<script src="js/secret2-data.js?v=secret2-20260922f"></script><script src="js/secret2.js?v=1009r89"></script><script>
const params=new URLSearchParams(location.search);const all=window.Secret2Data;
let chosen=Number(params.get('n'))||0;const s=Number(params.get('s'));if(!chosen&&s)chosen=all[Math.max(0,Math.min(all.length-1,s-1))].n;
document.body.classList.toggle('single',!!chosen);document.body.classList.toggle('clean',params.has('clean'));document.body.classList.toggle('embed',params.has('embed'));
const entries=chosen?all.filter(x=>x.n===chosen):all;
grid.innerHTML=entries.map(d=>`<article data-n="${d.n}"><div class="slide sf-slide"><div class="sf-shell">${Secret2.render(d)}</div></div><a href="?n=${d.n}"><span>${d.n-227} · v5 s=${d.n}</span><span>Открыть ↗</span></a></article>`).join('');
if(chosen){const at=all.findIndex(x=>x.n===chosen),d=all[at];position.textContent=`${at+1} / ${all.length} · v5 s=${d.n}${d.dirk?' · '+d.dirk:''}`;src.href=`secret2-source.html?clean&s=${d.n}`;if(d.note&&!params.has('clean'))notes.textContent='Заметка: '+d.note;
prev.onclick=()=>location.search='?n='+all[Math.max(0,at-1)].n+(params.has('clean')?'&clean':'');next.onclick=()=>location.search='?n='+all[Math.min(all.length-1,at+1)].n+(params.has('clean')?'&clean':'');
document.addEventListener('keydown',e=>{if(params.has('embed')&&window.parent!==window){if(['ArrowRight','ArrowLeft',' ','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();window.parent.postMessage({type:'secret2-import-nav',key:e.key===' '?'ArrowRight':e.key},location.origin);}return;}if(e.key==='ArrowRight'||e.key===' ')next.click();if(e.key==='ArrowLeft')prev.click()});
document.querySelectorAll('iframe[data-src]').forEach(f=>{const body=f.closest('.s2-browser-body');const fit=()=>{if(body)f.style.setProperty('--k',(body.clientWidth/1280).toFixed(4))};fit();addEventListener('resize',fit);f.addEventListener('load',()=>f.classList.add('sf-loaded'),{once:true});f.src=f.dataset.src});
}else{prev.onclick=()=>history.back();next.onclick=()=>location.search='?n='+all[0].n}
</script></body></html>
