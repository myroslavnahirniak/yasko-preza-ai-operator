<script>

 {k:'Готовые базы',c:'#f2a900',it:[['04','База шаблонов сайтов по нишам',600],['05','База кейсов под все услуги',400]]},
 {k:'Чтобы продавать',c:'#e3dfd8',it:[['06','Настройки агента-продавца',1200],['07','Скрипты продаж и шаблоны КП',400],['08','Договоры и приём оплаты',350]]},
 {k:'Чтобы находить клиентов',c:'#b3a996',it:[['09','Связки топовых локаций',500],['10','Каталог связок + новые связки',600]]},

 {k:'Люди рядом',c:'#5d564e',it:[['13','Куратор проверяет каждый шаг',1100],['14','Закрытый чат и рейтинг',300],['15','Доска объявлений: работа и клиенты',600],['16','Живые Q&A · 10 сессий',900],['17','Групповые страт-сессии · 4 сессии',1500]]}];

const sum=c=>c.it.reduce((a,x)=>a+x[2],0), TOTAL=CAT.reduce((a,c)=>a+sum(c),0);
const H='<h1 class="h fx-up">Что входит <em>целиком</em></h1>', T='<div class="tot fx-up" style="animation-delay:.4s"><span>Ценность целиком</span><b>'+f(TOTAL)+'</b></div>';
window.VARIANTS={
A:{html:H+'<div class="grid fx-up" style="animation-delay:.15s">'+CAT.map(c=>'<div class="c"><span class="k">'+c.k+'</span>'+c.it.map(x=>'<div class="r"><span><i>'+x[0]+'</i>'+x[1]+'</span><b>'+f(x[2])+'</b></div>').join('')+'<div class="sub"><small>итого</small>'+f(sum(c))+'</div></div>').join('')+'</div>'+T,
   desc:'6 карток за категоріями (система й агенти, бази, продажі, клієнти, інструменти, люди). У кожній — пункти з цінами й підсумок категорії жовтим; унизу загальна сума. Чітка структура замість суцільного списку; чіпи з цінами агентів прибрано (сума агентів — в одному рядку).'},
B:{html:H+'<div class="bar fx-up" style="animation-delay:.1s">'+CAT.map(c=>'<i style="flex:'+sum(c)+';background:'+c.c+'">'+(sum(c)>1500?f(sum(c)):'')+'</i>').join('')+'</div><div class="leg fx-up" style="animation-delay:.15s">'+CAT.map(c=>'<span style="--c:'+c.c+'">'+c.k+' · '+f(sum(c))+'</span>').join('')+'</div><div class="list fx-up" style="animation-delay:.25s">'+CAT.map(c=>c.it.map(x=>'<div class="r" style="--c:'+c.c+'"><i>'+x[0]+'</i><span>'+x[1]+'</span><b>'+f(x[2])+'</b></div>').join('')).join('')+'</div>'+T,
   desc:'Зверху — смуга, з чого складається $21.350 (частка кожної категорії видно одразу), під нею легенда. Нижче всі 17 пунктів у дві колонки, кольорова позначка = категорія. Найбільше цифр, але порядок у них.'},
C:{html:H+'<div class="grid fx-up" style="animation-delay:.15s">'+CAT.map(c=>'<div class="c"><span class="k">'+c.k+'</span><span class="s">'+f(sum(c))+'</span><span class="n">'+c.it.length+' '+(c.it.length===1?'пункт':c.it.length<5?'пункта':'пунктов')+'</span><ul>'+c.it.map(x=>'<li>'+x[1]+'</li>').join('')+'</ul></div>').join('')+'</div>'+T,
